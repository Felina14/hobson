      - {claim: "a refund was issued for order O-55102", truth: false, kind: contradicted}
      - {claim: "return R-7731 was graded as damaged", truth: false, kind: contradicted}
      - {claim: "order O-55102 was paid in cash", truth: false, kind: near-miss}
      - {claim: "return R-7731 was received on 15 October", truth: false, kind: near-miss}

  bank-dispute:
    facts:
      - "account A-60021 belongs to Sunita Rao"
      - "a card payment of 18,400 rupees to Voltix Electronics was posted to account A-60021 on 14 October"
      - "Sunita Rao reported the card ending 4471 as lost on 16 October"
      - "the card ending 4471 was blocked on 16 October"
    claims:
      - {claim: "account A-60021 belongs to Sunita Rao", truth: true, kind: direct}
      - {claim: "a payment to Voltix Electronics was posted to account A-60021", truth: true, kind: paraphrase}
      - {claim: "the card ending 4471 was reported lost", truth: true, kind: paraphrase}
      - {claim: "the card ending 4471 has been blocked", truth: true, kind: paraphrase}
      - {claim: "the card ending 4471 was reported lost before the Voltix payment", truth: false, kind: contradicted}
