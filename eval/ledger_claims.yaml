      - {claim: "SKU K-118 is stored in aisle 3", truth: false, kind: near-miss}
      - {claim: "SKU K-220 has 500 units in stock", truth: false, kind: contradicted}
      - {claim: "a cycle count of SKU K-220 was completed", truth: false, kind: near-miss}

  warehouse-returns:
