# Held-out test set for the ledger guard (patterns/ledger_guard.py).
#
# Written on 24 Oct 2026 before any model saw it, and committed before the first run, so the
# git history shows it was not tuned to the results. Four domains Hobson has never run: a
# clinic, a warehouse, a bank and an airline. Twelve records, eight claims each: four true,
# four false. Nothing here is changed after the run.
#
# A claim is TRUE when the record states it (`direct`) or says the same thing in other words
# (`paraphrase`). A FALSE claim is one of:
#   contradicted  the record says otherwise
#   invented      the record never mentions it (the bluff: a key, an uncle, a cabinet)
#   near-miss     close to a recorded fact but wrong in one detail (an amount, a name, a place)

records:

  clinic-appointment:
    facts:
      - "patient P-208 booked a dermatology appointment for 3 November at 10:30"
      - "patient P-208 paid a consultation deposit of 500 rupees"
      - "patient P-208 is allergic to penicillin"
      - "Dr. Meera Iyer is the dermatologist assigned to patient P-208"
      - "patient P-208 has not uploaded any lab reports"
    claims:
      - {claim: "patient P-208 has an appointment on 3 November", truth: true, kind: paraphrase}
      - {claim: "patient P-208 paid a deposit", truth: true, kind: paraphrase}
      - {claim: "patient P-208 has a penicillin allergy", truth: true, kind: paraphrase}
      - {claim: "Dr. Meera Iyer is assigned to patient P-208", truth: true, kind: direct}
      - {claim: "patient P-208 uploaded a blood test report", truth: false, kind: contradicted}
      - {claim: "patient P-208 was prescribed amoxicillin", truth: false, kind: invented}
      - {claim: "patient P-208 paid the full consultation fee of 1,500 rupees", truth: false, kind: near-miss}
      - {claim: "patient P-208 has an appointment with a cardiologist", truth: false, kind: near-miss}

  clinic-prescription:
    facts:
      - "patient P-551 was prescribed metformin 500 mg twice a day on 12 September"
      - "the prescription for patient P-551 allows two refills"
      - "patient P-551 collected the first refill on 10 October"
      - "the clinic pharmacy is closed on Sundays"
    claims:
      - {claim: "patient P-551 has a metformin prescription", truth: true, kind: paraphrase}
      - {claim: "the prescription for patient P-551 allows refills", truth: true, kind: paraphrase}
      - {claim: "patient P-551 has collected one refill", truth: true, kind: paraphrase}
      - {claim: "the clinic pharmacy is closed on Sundays", truth: true, kind: direct}
      - {claim: "patient P-551 has collected both refills", truth: false, kind: contradicted}
      - {claim: "patient P-551 was prescribed insulin", truth: false, kind: invented}
      - {claim: "the doctor renewed the prescription for patient P-551 last week", truth: false, kind: invented}
      - {claim: "the clinic pharmacy is open on Sundays", truth: false, kind: contradicted}

  clinic-insurance:
    facts:
      - "patient P-090 is covered by StarCare insurance, policy SC-77120"
      - "StarCare approved a pre-authorisation for an MRI of the left knee for patient P-090"
      - "the MRI pre-authorisation for patient P-090 expires on 30 November"
      - "patient P-090 has a co-pay of 10 percent"
    claims:
      - {claim: "patient P-090 is covered by StarCare insurance", truth: true, kind: direct}
      - {claim: "an MRI was pre-authorised for patient P-090", truth: true, kind: paraphrase}
      - {claim: "the MRI pre-authorisation for patient P-090 is valid until the end of November", truth: true, kind: paraphrase}
      - {claim: "patient P-090 has a co-pay", truth: true, kind: paraphrase}
      - {claim: "StarCare approved knee surgery for patient P-090", truth: false, kind: invented}
      - {claim: "the MRI pre-authorisation for patient P-090 covers the right knee", truth: false, kind: near-miss}
      - {claim: "patient P-090 has no co-pay", truth: false, kind: contradicted}
      - {claim: "patient P-090 is covered by MediShield insurance", truth: false, kind: near-miss}

  warehouse-shipment:
    facts:
      - "shipment S-3310 contains 40 cartons of ceramic tiles"
      - "shipment S-3310 arrived at dock 4 on 18 October"
      - "12 cartons in shipment S-3310 were recorded as damaged on arrival"
      - "the damage report for shipment S-3310 was signed by supervisor Ravi Kumar"
    claims:
      - {claim: "shipment S-3310 has arrived", truth: true, kind: paraphrase}
      - {claim: "some cartons in shipment S-3310 were damaged", truth: true, kind: paraphrase}
      - {claim: "supervisor Ravi Kumar signed the damage report for shipment S-3310", truth: true, kind: direct}
      - {claim: "shipment S-3310 contains ceramic tiles", truth: true, kind: direct}
      - {claim: "all 40 cartons in shipment S-3310 were damaged", truth: false, kind: contradicted}
      - {claim: "shipment S-3310 was rejected and sent back to the supplier", truth: false, kind: invented}
      - {claim: "shipment S-3310 arrived at dock 2", truth: false, kind: near-miss}
      - {claim: "the driver signed the damage report for shipment S-3310", truth: false, kind: near-miss}

  warehouse-inventory:
