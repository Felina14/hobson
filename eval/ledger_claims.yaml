      - {claim: "the September EMI for loan L-9045 was paid", truth: true, kind: paraphrase}
      - {claim: "the October EMI for loan L-9045 has not been paid", truth: true, kind: paraphrase}
      - {claim: "the October EMI for loan L-9045 was paid", truth: false, kind: contradicted}
      - {claim: "loan L-9045 has been closed early", truth: false, kind: invented}
      - {claim: "customer C-1180 was granted an EMI holiday", truth: false, kind: invented}
