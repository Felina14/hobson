# Every typed question Hobson asks Strands Decider. Edit freely; any change to the wording
# below must be logged in README.md ("Question wording changes").
threshold: 0.6   # any decision with confidence below this is unsure and re-made by Nova Lite

# The policy pattern: classify the request before the agent acts. Fixed, setting-free categories;
# the category picks which checks follow (claims for bluff/talk, holdings for take/use/talk).
dice:
  type: choice
  question: "Which kind of action is the player attempting?"
  options:
    move:       "Go somewhere, enter or leave a place"
    talk:       "Speak to a character: ask, persuade, greet, threaten verbally"
    take:       "Pick up, steal, buy or receive an item"
    use:        "Use, give or combine an item the player holds"
    attack:     "Physical violence or force against a character or object"
    bluff:      "Claim something is true, or show or present something, to deceive"
    examine:    "Look at, search or inspect something without changing it"
    impossible: "Something the world rules or the setting make impossible: fly, teleport, magic, pay with money not held"
    other:      "None of the above or unclear"

ledger_claim:
  type: noul
  question: "Has the following been established earlier in this story (in the ledger): {claim}?"
  criteria: {"true": "the ledger says so", "false": "the ledger does not say so"}
  # asked against the state WITHOUT the action (see README, "Question wording changes")

outcome:
  type: choice
  question: "Given the scene, the ledger and the action, which of these outcomes happens?"
  # options: 4 candidates Nova Lite proposes for this action in this state, plus not-possible-here

# The continuity guard: Decider reads the narrator's paragraph against the ledger and the ruling.
# A contradicting paragraph is swapped for the other draft, or rewritten once.
# The continuity guard: one concrete noul per thing the paragraph could get wrong, built per turn
# by handlers/continuity.py:checks_for(). Templates:
continuity:
  type: noul
  claim:   "Does the PARAGRAPH show this as true or happening: {claim}?"            # expect no
  holding: "Does the PARAGRAPH show the player using, holding or handing over {item}?"  # expect no
  fail:    "Does the PARAGRAPH show the attempt succeeding in any form ({effect})?"  # expect no, when the condition was not met
  outcome: "Does the PARAGRAPH show this happening: {effect}?"                        # expect yes
  criteria: {"true": "yes, the paragraph shows it", "false": "no, the paragraph does not show it"}

grounding:
  type: noul
  question: "Does the ledger establish that the player currently holds {object} in at least the amount {amount}?"
  criteria: {"true": "the ledger says so", "false": "the ledger does not say so"}
  # asked only when the dice picks take/use/talk AND the action names an object or quantity
  ask_for: [take, use, talk]

editor:
  # pointwise: each draft scored alone on the gauntlet's Ep5 rubric (0-6); the higher wins,
  # within 0.2 is a tie -> A
  type: score
  question: "How good is this paragraph as the next beat of the story: vivid, consistent with the rulings and the ledger, and in the same voice?"
  levels: ["useless", "poor", "weak", "acceptable", "good", "very good", "excellent"]
  tie: 0.2
  # the consistency check: the A/B pick asked in both orders
  swap_question: "Which paragraph is the better next beat: vivid, consistent with the rulings and the ledger, and in the same voice?"
  swap_options: {A: "Draft A", B: "Draft B"}
